<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a5000b">
  <title>Khảo sát chất lượng chuyên đề tập huấn</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 20px; text-align: center;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #fff7f7; color: #252525;
    }
    .box { max-width: 520px; padding: 28px; background: #fff; border-radius: 22px; box-shadow: 0 12px 35px rgba(0,0,0,.12); }
    .spinner { width: 42px; height: 42px; margin: 0 auto 16px; border: 4px solid #f1d4d6; border-top-color: #a5000b; border-radius: 50%; animation: spin .8s linear infinite; }
    h1 { margin: 0 0 8px; color: #a5000b; font-size: 21px; }
    p { margin: 0 0 18px; color: #666; line-height: 1.6; }
    a { display: inline-block; padding: 12px 20px; border-radius: 12px; color: #fff; background: #a5000b; font-weight: 700; text-decoration: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner"></div>
    <h1>Đang chuyển đến hệ thống khảo sát</h1>
    <p>Nếu trang không tự mở, vui lòng bấm nút bên dưới.</p>
    <a id="openDirect">MỞ HỆ THỐNG</a>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxICMr-MXJ06H5JpdnOZ-nieXpjtBGOVd3-X3g7N12Hj6GkaoYThy9tVl1OjSrXXlNw/exec';
    const targetUrl = WEB_APP_URL + window.location.search + window.location.hash;
    const directLink = document.getElementById('openDirect');
    directLink.href = targetUrl;
    setTimeout(() => window.location.replace(targetUrl), 500);
  </script>
</body>
</html>
